name: release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: powershell -ExecutionPolicy Bypass -File scripts/package.ps1
          - os: ubuntu-22.04
            script: sh scripts/package-appimage.sh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --release

      - name: Fichier à distribuer
        run: ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: BoomGround-${{ runner.os }}
          path: dist/*

  android:
    name: APK Android
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: NDK et SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.1.10909125" "platforms;android-34" "build-tools;36.1.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Rust (cible Android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Construire l'APK
        working-directory: android
        run: |
          gradle --no-daemon assembleRelease
          cp build/outputs/apk/release/*.apk BoomGround.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BoomGround-Android
          path: android/BoomGround.apk

  # --- Publication ---
  # butler pousse les builds sur itch.io (`dotriric/boomground`) ; sur un
  # tag v*, la release GitHub est aussi créée.
  publish:
    needs: [build, android]
    runs-on: ubuntu-22.04
    env:
      ITCH_API_KEY: ${{ secrets.ITCH_API_KEY }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*

      - name: butler push (itch.io)
        if: env.ITCH_API_KEY != ''
        run: |
          curl -fsSL --retry 3 --retry-delay 2 https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default -o butler.zip
          unzip -q butler.zip && chmod +x butler
          ./butler login --api-key "$ITCH_API_KEY"
          V=$(grep '^version' Cargo.toml | cut -d'"' -f2)
          [ -f dist/BoomGround-Setup.exe ] && ./butler push dist/BoomGround-Setup.exe dotriric/boomground:windows --userversion "$V" --if-changed || true
          [ -f dist/BoomGround-x86_64.AppImage ] && ./butler push dist/BoomGround-x86_64.AppImage dotriric/boomground:linux --userversion "$V" --if-changed || true
          [ -f dist/BoomGround.apk ] && ./butler push dist/BoomGround.apk dotriric/boomground:android --userversion "$V" --if-changed || true
