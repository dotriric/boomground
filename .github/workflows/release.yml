# Construit le jeu pour Windows (BoomGround-Setup.exe), Linux
# (BoomGround-x86_64.AppImage) et Android (BoomGround.apk).
#
# Deux circuits de distribution :
# - push sur master/main → build « early access » (titre marqué, voir
#   BOOM_CHANNEL ci-dessous), poussé avec butler sur le projet itch.io
#   PRIVÉ `dotriric/boomground-early-access` (visibilité « Restricted » :
#   seuls les membres du Discord officiel avec le rôle early access y ont
#   accès, invités depuis la page itch).
# - tag `v*` (ex. `git tag v1.8.0 && git push --tags`) : build public,
#   release GitHub + butler sur le projet itch.io PUBLIC `dotriric/boomground`.
#
# Secret requis : ITCH_API_KEY (clé API itch.io, compte owner).
name: release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Tag v* = build public « release » ; branche = build « early access »
    # (marqué dans le titre de la fenêtre, canal itch.io privé).
    env:
      BOOM_CHANNEL: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'early-access' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: powershell -ExecutionPolicy Bypass -File scripts/package.ps1
          - os: ubuntu-22.04
            script: sh scripts/package-appimage.sh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --release

      - name: Fichier à distribuer
        run: ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: BoomGround-${{ runner.os }}
          path: dist/*

  # APK Android (utilisable aussi sur GrapheneOS, qui est un Android sans
  # Google Play). Isolé du job bureau : le SDK/NDK Android n'y sert à rien et
  # allongerait la compilation de tous les autres.
  android:
    name: APK Android
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: NDK et SDK
        run: |
          # SDK préinstallé sur le runner (l'action setup-android échoue :
          # elle installe le paquet « tools », retiré par Google).
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.1.10909125" "platforms;android-34" "build-tools;36.1.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Rust (cible Android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Construire l'APK
        working-directory: android
        run: |
          gradle --no-daemon assembleRelease
          cp build/outputs/apk/release/*.apk BoomGround.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BoomGround-Android
          path: android/BoomGround.apk

  # --- Publication ---
  # Sur un tag v* : release GitHub (publique) + itch.io public.
  # Sur une branche : itch.io early access (projet privé, accès restreint
  # aux membres du Discord officiel ayant le rôle EA).
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android]
    runs-on: ubuntu-22.04
    env:
      ITCH_API_KEY: ${{ secrets.ITCH_API_KEY }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
      - name: butler (itch.io public)
        if: env.ITCH_API_KEY != ''
        run: |
          curl -sL https://broth.itch.ovh/butler/linux-amd64/LATEST/archive/default -o butler.zip
          unzip -q butler.zip && chmod +x butler-linux-amd64/butler
          ./butler-linux-amd64/butler login --api-key "$ITCH_API_KEY"
          V=$(grep '^version' Cargo.toml | cut -d'"' -f2)
          ./butler-linux-amd64/butler push dist/BoomGround-Setup.exe dotriric/boomground:windows --userversion "$V"
          ./butler-linux-amd64/butler push dist/BoomGround-x86_64.AppImage dotriric/boomground:linux --userversion "$V"
          ./butler-linux-amd64/butler push dist/BoomGround.apk dotriric/boomground:android --userversion "$V"

  early-access:
    if: github.ref_type == 'branch' && !startsWith(github.ref, 'refs/tags/')
    needs: [build, android]
    runs-on: ubuntu-22.04
    env:
      ITCH_API_KEY: ${{ secrets.ITCH_API_KEY }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Projet itch.io SÉPARÉ et PRIVÉ : visibilité « Restricted », accès
      # accordé uniquement aux membres du Discord officiel avec le rôle
      # early access (invités depuis la page itch ou via l'intégration
      # Discord). Personne d'autre ne peut télécharger ces builds.
      - name: butler (itch.io early access, privé)
        if: env.ITCH_API_KEY != ''
        run: |
          curl -sL https://broth.itch.ovh/butler/linux-amd64/LATEST/archive/default -o butler.zip
          unzip -q butler.zip && chmod +x butler-linux-amd64/butler
          ./butler-linux-amd64/butler login --api-key "$ITCH_API_KEY"
          V=$(grep '^version' Cargo.toml | cut -d'"' -f2)
          ./butler-linux-amd64/butler push dist/BoomGround-Setup.exe dotriric/boomground-early-access:windows --userversion "$V-ea"
          ./butler-linux-amd64/butler push dist/BoomGround-x86_64.AppImage dotriric/boomground-early-access:linux --userversion "$V-ea"
          ./butler-linux-amd64/butler push dist/BoomGround.apk dotriric/boomground-early-access:android --userversion "$V-ea"
